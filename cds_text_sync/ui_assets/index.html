<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTS Static Analysis</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #17191d; color: #e6e9ee; }
    body { margin: 0; min-width: 720px; }
    header { padding: 18px 24px; background: #22262d; border-bottom: 1px solid #383e49; }
    h1 { font-size: 19px; margin: 0 0 14px; }
    .toolbar, .filters { display: flex; gap: 8px; align-items: center; }
    input, select, button { font: inherit; border-radius: 5px; border: 1px solid #4a5361; padding: 8px 10px; background: #17191d; color: inherit; }
    input { flex: 1; min-width: 180px; } button { background: #2367a8; cursor: pointer; } button.secondary { background: #303742; }
    main { padding: 18px 24px; } #message { min-height: 21px; color: #aeb8c7; } #message.error { color: #ff9d9d; }
    #summary { display: flex; gap: 12px; margin: 14px 0; } .card { border: 1px solid #3b4350; border-radius: 6px; padding: 10px 14px; min-width: 100px; }
    .danger { color: #ff8181; } .suspicious { color: #ffca70; } .style { color: #8ebdff; }
    .layout { display: grid; grid-template-columns: minmax(500px, 3fr) minmax(280px, 2fr); gap: 16px; }
    .panel { border: 1px solid #3b4350; border-radius: 6px; overflow: auto; max-height: 500px; }
    table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #303640; font-size: 13px; } tr { cursor: pointer; } tr:hover, tr.selected { background: #293546; }
    .details { padding: 16px; white-space: pre-wrap; font-size: 13px; } .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>CTS Static Analysis</h1>
    <div class="toolbar"><input id="workspace" placeholder="Sync folder containing project-view/"><button class="secondary" id="browse">Browse…</button><button id="run">Analyze</button></div>
  </header>
  <main>
    <div id="message">Choose a workspace and run the offline analysis.</div>
    <div id="summary" class="hidden"></div>
    <div class="filters hidden" id="filters"><select id="severity"><option value="">All severities</option><option>danger</option><option>suspicious</option><option>style</option></select><input id="search" placeholder="Filter rule, file, or message"></div>
    <div class="layout"><div class="panel"><table><thead><tr><th>Severity</th><th>Rule</th><th>Location</th><th>Message</th></tr></thead><tbody id="findings"></tbody></table></div><aside class="panel"><div class="details" id="details">Select a finding to see details.</div></aside></div>
  </main>
  <script>
    let findings = [];
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function message(text, error=false) { $('message').textContent = text; $('message').className = error ? 'error' : ''; }
    function render() {
      const severity = $('severity').value, query = $('search').value.toLowerCase();
      const visible = findings.filter(f => !severity || f.severity === severity).filter(f => !query || `${f.rule_id} ${f.location.path} ${f.message}`.toLowerCase().includes(query));
      $('findings').innerHTML = visible.map((f, i) => `<tr data-index="${findings.indexOf(f)}"><td class="${esc(f.severity)}">${esc(f.severity)}</td><td>${esc(f.rule_id)}</td><td>${esc(f.location.path)}:${esc(f.location.line || '')}</td><td>${esc(f.message)}</td></tr>`).join('');
      document.querySelectorAll('#findings tr').forEach(row => row.onclick = () => selectFinding(findings[Number(row.dataset.index)], row));
    }
    function selectFinding(finding, row) {
      document.querySelectorAll('#findings tr').forEach(x => x.classList.remove('selected')); row.classList.add('selected');
      const loc = finding.location;
      $('details').innerHTML = `<strong>${esc(finding.rule_id)} — ${esc(finding.rule_title || '')}</strong>\n\n${esc(finding.message)}\n\nSeverity: ${esc(finding.severity)}\nLocation: ${esc(loc.path)}:${esc(loc.line || '')}\nFingerprint: ${esc(finding.fingerprint || '')}\n\n<button id="open-file">Open source file</button>`;
      $('open-file').onclick = async () => { const r = await window.pywebview.api.open_file(loc.path); if (!r.ok) message(r.error, true); };
    }
    async function run() {
      const workspace = $('workspace').value.trim(); if (!workspace) return message('Choose a workspace first.', true);
      message('Analyzing…'); $('run').disabled = true;
      const response = await window.pywebview.api.analyze(workspace); $('run').disabled = false;
      if (!response.ok) return message(response.error, true);
      findings = response.result.findings || []; const s = response.result.summary;
      $('summary').classList.remove('hidden'); $('filters').classList.remove('hidden');
      $('summary').innerHTML = `<div class="card"><b>${s.total}</b><br>findings</div><div class="card danger"><b>${s.by_severity.danger}</b><br>danger</div><div class="card suspicious"><b>${s.by_severity.suspicious}</b><br>suspicious</div><div class="card style"><b>${s.by_severity.style}</b><br>style</div><div class="card"><b>${s.diagnostics}</b><br>diagnostics</div>`;
      message(response.result.complete ? `Analysis complete: ${response.workspace}` : `Analysis incomplete: ${response.result.diagnostics.length} diagnostic(s).`, !response.result.complete); render();
    }
    $('run').onclick = run; $('browse').onclick = async () => { const path = await window.pywebview.api.choose_workspace(); if (path) $('workspace').value = path; }; $('severity').onchange = render; $('search').oninput = render;
    window.addEventListener('pywebviewready', async () => { const state = await window.pywebview.api.initial_state(); if (state.workspace) $('workspace').value = state.workspace; });
  </script>
</body>
</html>
