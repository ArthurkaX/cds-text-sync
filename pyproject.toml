# The product is .NET (products/codesys-agent); the Python left here is the
# IronPython script headless CODESYS runs, the repository's tools and tests.
# This file only configures the linters for them.

[tool.ruff]

[tool.ruff.lint]
# Keep the CI contract stable when Ruff changes its default rule selection.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/*.py" = ["E402"]
