[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-text-sync"
dynamic = ["version"]
description = "CODESYS CLI + reverse-pipe daemon"
requires-python = ">=3.11"
authors = [{ name = "cds-text-sync contributors" }]

[project.urls]
Homepage = "https://github.com/ArthurkaX/cds-text-sync"

[project.scripts]
cts = "cds_text_sync.main:main"
cds-text-sync = "cds_text_sync.main:main"

[project.optional-dependencies]
# Kept optional: the command-line and CI workflows must stay dependency-free.
ui = ["pywebview>=5,<6"]

[tool.setuptools.dynamic]
version = { attr = "cds_text_sync.__version__" }

[tool.setuptools.packages.find]
include = ["cds_text_sync", "cds_text_sync.*", "cds_static_analyzer", "cds_static_analyzer.*"]
where = [".", "products/cds-static-analyzer/src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cds_text_sync = ["CLI.md", "TEST_FORMAT.md", "ui_assets/*"]
"cds_text_sync.engine" = ["sys_funcs.json"]
"cds_text_sync.visu" = [
  "catalog/*.json",
  "templates/*.tmpl",
  "themes/*.json",
  "styles_snapshot.json",
  "stylesheet.css",
  "DESIGN.md",
]
"cds_static_analyzer" = ["rules/*.py", "rules/*.md"]

[tool.ruff]

[tool.ruff.lint.per-file-ignores]
# These modules deliberately modify sys.path or load CLR namespaces before
# importing runtime-only modules. Moving those imports would break IronPython
# and CODESYS-hosted execution.
"cds_text_sync/_cli_io.py" = ["E402"]
"products/codesys-host/src/ide_bridge/*.py" = ["E402"]
"src/ide_bridge/*.py" = ["E402"]
"tests/unit/*.py" = ["E402"]
