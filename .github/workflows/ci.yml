name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline regression
    runs-on: windows-latest

    steps:
      - name: Checkout cds-text-sync
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        shell: pwsh
        run: python -m pytest tests\unit

      - name: Analyze selftest (rules against their own docs)
        shell: pwsh
        run: python tools\ci_analyze_checks.py selftest

      - name: Build wheel and verify rule assets ship in the package
        shell: pwsh
        run: python tools\ci_analyze_checks.py wheel

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall `
            products/codesys-host/cds_bootstrap.py `
            products/codesys-host/Project_build.py `
            products/codesys-host/Project_analyze_ui.py `
            products/codesys-host/Project_compare_ui.py `
            products/codesys-host/Project_directory.py `
            products/codesys-host/Project_discover.py `
            products/codesys-host/Project_export.py `
            products/codesys-host/Project_import.py `
            products/codesys-host/Project_options.py `
            products/codesys-host/Project_resources.py `
            products/codesys-host/Project_snapshooter.py `
            products/codesys-host/Project_daemon.py `
            cds_text_sync `
            src

      - name: Run local regression suite
        shell: pwsh
        run: python tests\regression\regression_suite.py
