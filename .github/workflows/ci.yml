name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline regression
    runs-on: windows-latest

    steps:
      - name: Checkout cds-text-sync
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Run full test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Check Python style
        shell: pwsh
        run: python -m ruff check .

      - name: Analyze selftest (rules against their own docs)
        shell: pwsh
        run: python tools\ci_analyze_checks.py selftest

      - name: Build wheel and verify rule assets ship in the package
        shell: pwsh
        run: python tools\ci_analyze_checks.py wheel

      - name: Verify product manifests and package boundaries
        shell: pwsh
        run: python tools\ci_product_checks.py manifests; python tools\ci_product_checks.py wheels

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q `
            products/cds-text-sync/src `
            products/cds-static-analyzer/src `
            products/cds-cli/src `
            products/visu-lint/src `
            products/codesys-host/src/ide_bridge `
            products/codesys-host/cds_bootstrap.py `
            products/codesys-host/Project_build.py `
            products/codesys-host/Project_fmt.py `
            products/codesys-host/Project_fsm.py `
            products/codesys-host/Project_analyze_ui.py `
            products/codesys-host/Project_compare_ui.py `
            products/codesys-host/Project_directory.py `
            products/codesys-host/Project_discover.py `
            products/codesys-host/Project_export.py `
            products/codesys-host/Project_import.py `
            products/codesys-host/Project_options.py `
            products/codesys-host/Project_resources.py `
            products/codesys-host/Project_snapshooter.py `
            products/codesys-host/Project_daemon.py `
            cds_text_sync

      - name: Run local regression suite
        shell: pwsh
        run: python tests\regression\regression_suite.py

      - name: Verify clean-tree packaging state
        shell: pwsh
        run: python tools\ci_product_checks.py clean
