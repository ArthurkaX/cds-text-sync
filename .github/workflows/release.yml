name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    name: Attach install zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build release zip
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git archive --format=zip --prefix="cds-text-sync-$TAG/" -o "cds-text-sync-$TAG.zip" "$TAG"

      - name: Upload asset to release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "cds-text-sync-$TAG.zip" --clobber -R "$GITHUB_REPOSITORY"
