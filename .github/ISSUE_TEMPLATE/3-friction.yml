name: 😖 Friction / awkward to use
description: Nothing is broken, but something is confusing, tedious, or surprising. No repro needed.
title: "[FRICTION] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **This is not a bug report and you do not need to prove anything.**

        The tool works, so almost nobody opens an issue to say "this step is confusing" or
        "I always forget which command comes first". That feedback never arrives — and it is exactly
        the feedback that improves the tool for the next person.

        Half a sentence is enough. Rough wording, partial memory of what happened, or a complaint
        without a proposed fix are all welcome.

  - type: textarea
    id: friction
    attributes:
      label: What felt awkward?
      description: Confusing wording, a step you keep getting wrong, something you expected to be automatic, a message that did not tell you what to do next.
      placeholder: |
        Examples of the kind of thing worth writing here:
        - "I never remember whether export goes IDE→disk or disk→IDE."
        - "After a failed import I don't know whether the project is in a safe state."
        - "The settings dialog has an option I have never understood."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: Optional. If you don't know what the right behavior is, leave this empty — describing the confusion is the useful part.

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Optional. CODESYS and cds-text-sync version, if you remember them.
      placeholder: "CODESYS 3.5.19.40 / cds-text-sync 2.8.1"

  - type: checkboxes
    id: followup
    attributes:
      label: Follow-up
      options:
        - label: I am willing to answer a follow-up question or try a fix before it is released.
          required: false
