[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-static-analyzer"
version = "3.0.0"
description = "Human-facing static analysis for CODESYS Structured Text"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "../../shared/src"]

[tool.setuptools.package-data]
cds_static_analyzer = ["rules/*.py", "rules/*.md"]

[tool.cds_product]
runtime = "cpython"
test_paths = [
  "tests/test_*.py",
  "../../tests/unit/test_analyze_project.py",
  "../../tests/unit/test_analyze_runner.py",
  "../../tests/unit/test_rule_resilience.py",
]
