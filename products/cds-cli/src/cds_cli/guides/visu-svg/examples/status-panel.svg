<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480">

  <!-- ============================================================
       Status panel. Shows the type scale and the status colours:
       one h1 per screen, an h2 per section, label for body text,
       caption for units and notes, value for a read-out.

       COLOURS: never write one. Put class="..." on the element and
       the active CODESYS style picks the colour.
         surfaces  panel  card  divider
         type      h1 (22)  h2 (16)  value (28)  label (12)  caption (11)
         emphasis  muted  inverse
         status    ok  warn  alarm
         P&ID      pipe-water  metal
       Buttons, textfields and lamps take NO class: they inherit the
       native CODESYS control style.

       LAYOUT: 24px page margin, 16px between blocks, 16px panel
       padding, coordinates on a 4px grid.
       ============================================================ -->

  <!-- header -->
  <text class="h1" x="24" y="46">Status Panel</text>
  <text class="caption" x="616" y="40" data-width="160" text-anchor="middle">Line 1 / Shift A</text>
  <line class="divider" x1="24" y1="72" x2="776" y2="72"/>

  <!-- left panel: status rows. A 16px swatch reads as a state light;
       use data-cds-type="lamp" instead when it must follow a variable. -->
  <rect class="panel" x="24" y="88" width="368" height="296"/>
  <text class="h2" x="40" y="120">Machine status</text>

  <rect class="ok" x="40" y="144" width="16" height="16" rx="2"/>
  <text class="label" x="68" y="156">Motor running</text>

  <rect class="warn" x="40" y="176" width="16" height="16" rx="2"/>
  <text class="label" x="68" y="188">Filter due for service</text>

  <rect class="alarm" x="40" y="208" width="16" height="16" rx="2"/>
  <text class="label" x="68" y="220">Pressure fault</text>

  <text class="caption" x="40" y="267">Faults latch until acknowledged.</text>

  <!-- right panel: live values. A label baseline and the field under it are
       24px apart, which leaves 16px between the field and the next label. -->
  <rect class="panel" x="408" y="88" width="368" height="296"/>
  <text class="h2" x="424" y="120">Live values</text>

  <text class="label" x="424" y="148">Temperature</text>
  <text data-cds-type="textfield" x="424" y="172" data-width="336" data-height="32"
        data-text-var="HMI.Temperature" font-size="12">%3.1f C</text>

  <text class="label" x="424" y="220">Pressure</text>
  <text data-cds-type="textfield" x="424" y="244" data-width="336" data-height="32"
        data-text-var="HMI.Pressure" font-size="12">%3.2f bar</text>

  <text class="label" x="424" y="292">Throughput</text>
  <text class="value" x="424" y="332">1 284</text>
  <text class="caption" x="544" y="335">units / h</text>

  <!-- action row -->
  <line class="divider" x1="24" y1="392" x2="776" y2="392"/>
  <rect data-cds-type="button" x="24" y="408" width="160" height="48"
        data-text="Start" data-cds-tap="TAP HMI.StartPump"/>
  <rect data-cds-type="button" x="200" y="408" width="160" height="48"
        data-text="Stop" data-cds-action="OnMouseClick: ST HMI.StopPump := TRUE;"/>
</svg>
