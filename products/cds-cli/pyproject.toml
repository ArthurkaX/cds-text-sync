[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-cli"
version = "3.1.0"
description = "Command-line composition layer for cds-text-sync products"
requires-python = ">=3.11"
dependencies = [
  "cds-text-sync==3.1.0",
  "cds-static-analyzer==3.0.0",
  "visu-lint==3.1.0",
]

[project.scripts]
cts = "cds_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.cds_product]
runtime = "cpython"
test_paths = [
  "tests/test_*.py",
  "../../tests/unit/test_cli_handlers_daemon.py",
  "../../tests/unit/test_cli_handlers_patch.py",
  "../../tests/unit/test_cli_handlers_project.py",
  "../../tests/unit/test_cli_handlers_visu.py",
  "../../tests/unit/test_cli_text_output.py",
  "../../tests/unit/test_engine_cli_helpers.py",
]
